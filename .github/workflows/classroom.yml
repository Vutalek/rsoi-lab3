name: GitHub Classroom Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
env:
  FLIGHT_SERVICE_HOST: http://flight_service:8060
  TICKET_SERVICE_HOST: http://ticket_service:8070
  BONUS_SERVICE_HOST: http://bonus_service:8050
  FLIGHT_SERVICE_DB_PROTOCOL: postgresql+psycopg2
  FLIGHT_SERVICE_DB_USER: program
  FLIGHT_SERVICE_DB_PASSWORD: test
  FLIGHT_SERVICE_DB_PORT: "5432"
  FLIGHT_SERVICE_DB_NAME: flights
  TICKET_SERVICE_DB_PROTOCOL: postgresql+psycopg2
  TICKET_SERVICE_DB_USER: program
  TICKET_SERVICE_DB_PASSWORD: test
  TICKET_SERVICE_DB_PORT: "5432"
  TICKET_SERVICE_DB_NAME: tickets
  BONUS_SERVICE_DB_PROTOCOL: postgresql+psycopg2
  BONUS_SERVICE_DB_USER: program
  BONUS_SERVICE_DB_PASSWORD: test
  BONUS_SERVICE_DB_PORT: "5432"
  BONUS_SERVICE_DB_NAME: privileges
jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: |
          for service in flight_service ticket_service bonus_service; do
            (
              cd "$service"
              python -m pip install -r requirements.txt
              python -m pytest
            ) || exit 1
          done

  build:
    name: Build
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

  deploy:
    name: Deploy to VM
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Deploy via SSH
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_ENV: ${{ secrets.VM_ENV }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          SSH_OPTIONS=(
            -i "$HOME/.ssh/deploy_key"
            -p "$VM_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
          )
          TARGET="$VM_USER@$VM_HOST"
          git archive --format=tar HEAD |
            ssh "${SSH_OPTIONS[@]}" "$TARGET" \
              'mkdir -p "$HOME/rsoi-lab3" && tar -xf - -C "$HOME/rsoi-lab3"'
          printf '%s\n' "$VM_ENV" |
            ssh "${SSH_OPTIONS[@]}" "$TARGET" \
              'umask 077; cat > "$HOME/rsoi-lab3/.env"'
          ssh "${SSH_OPTIONS[@]}" "$TARGET" '
            set -e
            cd "$HOME/rsoi-lab3"
            docker compose up -d --build
            WAIT_PORTS=8080,8070,8060,8050 ./scripts/wait-script.sh
          '

  postman:
    name: Postman tests on VM
    needs: deploy
    runs-on: ubuntu-latest
    env:
      HAS_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v3

      - name: Connect to VM
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          SSH_OPTIONS=(
            -i "$HOME/.ssh/deploy_key"
            -p "$VM_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
          )
          TARGET="$VM_USER@$VM_HOST"
          ssh "${SSH_OPTIONS[@]}" -o ExitOnForwardFailure=yes \
            -f -N -L 127.0.0.1:8080:127.0.0.1:8080 "$TARGET"
          WAIT_PORTS=8080 ./scripts/wait-script.sh

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          # TODO insert your variant
          collection: postman/collection.json
          environment: postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        if: env.HAS_GOOGLE_API_KEY == 'true'
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 2
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"

  tolerance:
    name: Fault tolerance tests on VM
    needs: postman
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run fault tolerance tests on VM
        timeout-minutes: 15
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          ssh -i "$HOME/.ssh/deploy_key" -p "$VM_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd "$HOME/rsoi-lab3"
          docker pull postman/newman:alpine

          # Run Newman beside the services without installing Node.js on the VM.
          newman() {
            docker run --rm --network host \
              --user "$(id -u):$(id -g)" \
              -v "$PWD:$PWD" -w "$PWD" \
              postman/newman:alpine "$@"
          }
          export -f newman

          # Restore the service even when a Postman assertion fails while it is stopped.
          cleanup() {
            status=$?
            trap - EXIT
            docker compose start bonus_service || status=1
            WAIT_PORTS=8050 ./scripts/wait-script.sh || status=1
            exit "$status"
          }
          trap cleanup EXIT
          bash ./scripts/test-script.sh v1 bonus_service 8050
          REMOTE
